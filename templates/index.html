<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Harga Rumah</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <div class="container">
        <h2>Form Prediksi Data Baru</h2>
        <form id="predictionForm">
            <div class="formColumns">
                <label for="x1">Luas (m^2)</label>
                <input type="text" inputmode="decimal" id="x1" placeholder="Luas" required>
                <label for="x2">Jumlah kamar</label>
                <input type="text" inputmode="decimal" id="x2" placeholder="Jumlah kamar" required>
                <label for="x3">Jumlah kamar mandi</label>
                <input type="text" inputmode="decimal" id="x3" placeholder="Jumlah kamar mandi" required>
                <label for="x4">Usia rumah</label>
                <input type="text" inputmode="decimal" id="x4" placeholder="Usia rumah" required>
                <label for="x5">Jarak ke kota (km)</label>
                <input type="text" inputmode="decimal" id="x5" placeholder="Jarak ke kota" required>
            </div>
            <div class="buttonGroup">
                <button class="submit" type="submit">Prediksi Sekarang</button>
                <button class="reset" type="reset">Reset</button>
            </div>
        </form>
        
        <h3 id="result"></h3>
    </div>

    <script src="{{url_for('static', filename='script.js')}}"></script>
</body>
</html>
